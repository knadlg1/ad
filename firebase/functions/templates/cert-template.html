<html>
<head>
<meta charset="UTF-8">
<style>
  @page { size: A4; margin: 18mm 16mm; }
  * { box-sizing: border-box; }
  body {
    font-family: "Arial Unicode MS", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    color: #1a1a1a;
    margin: 0;
    font-size: 10pt;
  }
  table.cert {
    width: 100%;
    border-collapse: collapse;
  }
  table.cert td {
    border: 1px solid #333;
    padding: 12px 12px;
    font-size: 10pt;
    white-space: pre-wrap;
  }
  table.cert td.doc-number-cell {
    text-align: left;
    font-size: 9pt;
    color: #555;
  }
  table.cert td.title-cell {
    text-align: center;
    font-size: 40pt;
    font-weight: 700;
    padding: 20px 12px;
  }
  .label-cell {
    background: #f1f3f4;
    font-weight: 700;
    text-align: center;
  }
  .value-cell {
    background: #fff;
    text-align: center;
  }
  .statement-cell {
    text-align: center;
  }
  .statement-line {
    font-size: 12pt;
  }
  .date-line {
    margin-top: 3em;
    font-size: 13pt;
  }
  .academy-line-wrap {
    margin-top: 3em;
    font-size: 13pt;
    font-weight: 700;
  }
  .seal-cell {
    text-align: center;
    vertical-align: middle;
    min-height: 100px;
  }
  .fee-cell {
    text-align: center;
  }
</style>
</head>
<body>
  <table class="cert">
    <colgroup>
      <col style="width:21.5%">
      <col style="width:24%">
      <col style="width:39.5%">
      <col style="width:15%">
    </colgroup>

    <tr>
      <td colspan="4" class="doc-number-cell">문서번호 : {{문서번호}}</td>
    </tr>

    <tr>
      <td colspan="4" class="title-cell">수  강  증  명  서</td>
    </tr>

    <tr>
      <td rowspan="2" class="label-cell">훈 련 생</td>
      <td class="label-cell">① 성  명</td>
      <td colspan="2" class="value-cell">{{이름}}</td>
    </tr>
    <tr>
      <td class="label-cell">② 주민등록번호</td>
      <td colspan="2" class="value-cell">{{주민등록번호}}</td>
    </tr>

    <tr>
      <td rowspan="3" class="label-cell">수 강 내 역</td>
      <td class="label-cell">③ 수강직종</td>
      <td colspan="2" class="value-cell">간호조무사 자격증 취득과정</td>
    </tr>
    <tr>
      <td class="label-cell">④ 전체 훈련 기간</td>
      <td colspan="2" class="value-cell">{{전체훈련시작일}} ~ {{전체훈련종료일}}</td>
    </tr>
    <tr>
      <td class="label-cell">⑤ 전체 훈련 시간</td>
      <td colspan="2" class="value-cell">1520 시간</td>
    </tr>

    <tr>
      <td rowspan="3" class="label-cell">증 명</td>
      <td class="label-cell">⑥ 대상 기간</td>
      <td colspan="2" class="value-cell">{{신청기간}}</td>
    </tr>
    <tr>
      <td class="label-cell">⑦ 참여 일 수</td>
      <td colspan="2" class="value-cell">{{참여일수}}</td>
    </tr>
    <tr>
      <td class="label-cell">⑧ 참여 시간</td>
      <td colspan="2" class="value-cell">{{참여시간}}</td>
    </tr>

    <tr>
      <td colspan="4" class="statement-cell">
        <div class="statement-line">위와 같이 수강하고 있음을 증명합니다.</div>
        <div class="date-line">{{신청년}} 년   {{신청월}} 월   {{신청일}}</div>
        <div class="academy-line-wrap">                        {{학원이름}}                   (인)</div>
      </td>
    </tr>

    <tr>
      <td colspan="3" rowspan="2" class="seal-cell">{{ 직인 }}</td>
      <td class="fee-cell">수  수  료</td>
    </tr>
    <tr>
      <td class="fee-cell">없     음</td>
    </tr>
  </table>
</body>
</html>
