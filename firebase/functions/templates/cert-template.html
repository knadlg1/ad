<html>
<head>
<meta charset="UTF-8">
<style>
  @page { size: A4; margin: 18mm 16mm; }
  * { box-sizing: border-box; }
  body {
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    color: #1a1a1a;
    margin: 0;
    font-size: 11pt;
  }
  .doc-number {
    text-align: right;
    font-size: 9pt;
    color: #555;
    margin-bottom: 8mm;
  }
  h1 {
    text-align: center;
    font-size: 24pt;
    letter-spacing: 12pt;
    margin: 0 0 14mm 0;
  }
  table.info {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 14mm;
  }
  table.info th, table.info td {
    border: 1px solid #333;
    padding: 8px 12px;
    font-size: 11pt;
  }
  table.info th {
    background: #f1f3f4;
    width: 32%;
    text-align: left;
    font-weight: 700;
  }
  table.info td { width: 68%; }
  .statement {
    line-height: 1.9;
    margin: 10mm 0 18mm 0;
    text-align: center;
    font-size: 12pt;
  }
  .footer {
    text-align: center;
  }
  .footer .date {
    font-size: 13pt;
    margin-bottom: 10mm;
  }
  .footer .academy-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    font-size: 13pt;
    font-weight: 700;
  }
  .footer .academy-row img {
    width: 40px;
    height: 40px;
    object-fit: contain;
  }
</style>
</head>
<body>
  <div class="doc-number">문서번호: {{문서번호}}</div>
  <h1>수 강 증 명 서</h1>

  <table class="info">
    <tr><th>이름</th><td>{{이름}}</td></tr>
    <tr><th>주민등록번호</th><td>{{주민등록번호}}</td></tr>
    <tr><th>학원명</th><td>{{학원이름}}</td></tr>
    <tr><th>전체 훈련기간</th><td>{{전체훈련시작일}} ~ {{전체훈련종료일}}</td></tr>
    <tr><th>신청기간</th><td>{{신청기간}}</td></tr>
    <tr><th>참여일수</th><td>{{참여일수}}일</td></tr>
    <tr><th>참여시간</th><td>{{참여시간}}시간</td></tr>
  </table>

  <p class="statement">
    위 사람은 상기 신청기간 동안 본 학원의 실습 과정에<br>
    성실히 참여하였음을 증명합니다.
  </p>

  <div class="footer">
    <div class="date">{{신청년}}년 {{신청월}}월 {{신청일}}일</div>
    <div class="academy-row">
      <span>{{학원이름}}</span>
      {{ 직인 }}
    </div>
  </div>
</body>
</html>
