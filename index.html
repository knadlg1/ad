<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Here 출결관리 - 앱 다운로드</title>
    <meta name="apple-itunes-app" content="app-id=6772723198">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            padding: 40px 28px 36px;
            max-width: 340px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        .logo { font-size: 32px; font-weight: 800; color: #6c63ff; margin-bottom: 4px; }
        .sub { font-size: 13px; color: #888; margin-bottom: 8px; }
        .notice {
            background: #f0edff;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 13px;
            color: #5548c8;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .store-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            text-decoration: none;
            color: #fff;
            margin-bottom: 12px;
        }
        .store-btn.primary { background: #6c63ff; }
        .store-btn.secondary {
            background: #fff;
            border: 2px solid #d1d5db;
            color: #374151;
        }
        .store-btn svg { flex-shrink: 0; }
        .divider { font-size: 12px; color: #bbb; margin: 4px 0 16px; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">Here</div>
    <div class="sub">실습 출결관리</div>

    <div class="notice">
        웹 서비스가 종료되었습니다.<br>
        앱을 설치하면 더 편리하게 이용할 수 있어요!
    </div>

    <div id="btn-area"></div>
</div>

<script>
    const IOS_URL    = 'https://apps.apple.com/kr/app/here-%EC%B6%9C%EA%B2%B0%EA%B4%80%EB%A6%AC/id6772723198';
    const ANDROID_URL = 'https://play.google.com/store/apps/details?id=com.bbre.attendance&pcampaignid=web_share';

    const ua        = navigator.userAgent;
    const isIOS     = /iPhone|iPad|iPod/i.test(ua);
    const isAndroid = /Android/i.test(ua);

    const iosBtn = `
        <a class="store-btn primary" href="${IOS_URL}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
            App Store 다운로드
        </a>`;

    const playBtn = `
        <a class="store-btn primary" href="${ANDROID_URL}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3.18 23.76c.3.17.65.19.97.08l.07-.04 11.05-6.37-2.4-2.41-9.69 8.74zm-1.15-20.2C1.73 3.9 1.5 4.34 1.5 4.9v14.2c0 .56.23 1 .53 1.34l.07.06 7.95-7.95v-.19L2.03 3.56zm16.54 8.63-2.68-1.55-2.67 2.67 2.67 2.67 2.68-1.55c.77-.44.77-1.79 0-2.24zm-15.39 9.43 9.68-8.74-2.4-2.41-10.25 5.91a.93.93 0 0 0-.16 1.5l2.13 3.74.1.1-.05-.05-.13-.13.13.13c.03.02.08.05.13.07l-1.18-1.17 2 1.06z"/></svg>
            Google Play 다운로드
        </a>`;

    const iosBtnSecondary = `
        <div class="divider">또는</div>
        <a class="store-btn secondary" href="${IOS_URL}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
            App Store (iPhone)
        </a>`;

    const playBtnSecondary = `
        <div class="divider">또는</div>
        <a class="store-btn secondary" href="${ANDROID_URL}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3.18 23.76c.3.17.65.19.97.08l.07-.04 11.05-6.37-2.4-2.41-9.69 8.74zm-1.15-20.2C1.73 3.9 1.5 4.34 1.5 4.9v14.2c0 .56.23 1 .53 1.34l.07.06 7.95-7.95v-.19L2.03 3.56zm16.54 8.63-2.68-1.55-2.67 2.67 2.67 2.67 2.68-1.55c.77-.44.77-1.79 0-2.24zm-15.39 9.43 9.68-8.74-2.4-2.41-10.25 5.91a.93.93 0 0 0-.16 1.5l2.13 3.74.1.1-.05-.05-.13-.13.13.13c.03.02.08.05.13.07l-1.18-1.17 2 1.06z"/></svg>
            Google Play (Android)
        </a>`;

    const area = document.getElementById('btn-area');

    if (isIOS) {
        area.innerHTML = iosBtn + playBtnSecondary;
    } else if (isAndroid) {
        area.innerHTML = playBtn + iosBtnSecondary;
    } else {
        area.innerHTML = iosBtn + playBtnSecondary;
    }
</script>
</body>
</html>
